services:
  wpp-sticker-bot:
    image: saviomarques/wpp-sticker-bot:${IMAGE_TAG:-latest}
    container_name: wpp-sticker-bot
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.5
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
    volumes:
      - wpp_sticker_data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wpp_sticker_data:
